# Mockery v3 configuration, run with `make generate`. It generates a mock of
# each client interface into a mocks package beside it: the Docker SDK
# interface in client/docker, which the task layer's unit tests use in place
# of Docker, and the container tasks in client/containers, which the provider
# unit tests use in place of the task layer.
dir: '{{.InterfaceDir}}/mocks'
filename: 'mock_{{ snakecase .InterfaceName }}.go'
structname: Mock{{.InterfaceName}}
pkgname: mocks
template: testify
template-data:
  unroll-variadic: true
packages:
  github.com/jumppad-labs/xcl/example/plugin/plugins/docker/client/docker:
    interfaces:
      Docker: {}
  github.com/jumppad-labs/xcl/example/plugin/plugins/docker/client/containers:
    interfaces:
      Tasks: {}
