# Mockery v3 configuration, run with `make generate`. It generates the mock of
# the Docker client interface in plugins/docker/client, which the provider unit
# tests use in place of Docker.
dir: '{{.InterfaceDir}}/mocks'
filename: 'mock_{{ snakecase .InterfaceName }}.go'
structname: Mock{{.InterfaceName}}
pkgname: mocks
template: testify
template-data:
  unroll-variadic: true
packages:
  github.com/jumppad-labs/xcl/example/plugin/plugins/docker/client:
    interfaces:
      Docker: {}
