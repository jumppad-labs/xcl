<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 442 338" font-family="monospace" font-size="10">
<text x="8" y="19" xml:space="preserve">  <tspan fill="#666666" font-style="italic"># resource.container.api will be updated</tspan></text>
<text x="8" y="33" xml:space="preserve">  <tspan fill="#e5e510">~</tspan> <tspan fill="#bc3fbc" font-weight="bold">resource</tspan> <tspan fill="#11a8cd">&quot;container&quot;</tspan> <tspan fill="#0dbc79">&quot;api&quot;</tspan> {</text>
<text x="8" y="47" xml:space="preserve">      <tspan fill="#e5e510">~</tspan> <tspan fill="#e5e510">ports[0].host</tspan>      = <tspan fill="#d670d6">8080</tspan> -&gt; <tspan fill="#d670d6">9090</tspan></text>
<text x="8" y="61" xml:space="preserve">      <tspan fill="#0dbc79">+</tspan> <tspan fill="#0dbc79">ports[2]</tspan>           = { <tspan fill="#2472c8">host</tspan> = <tspan fill="#d670d6">443</tspan>, <tspan fill="#bc3fbc" font-weight="bold">local</tspan> = <tspan fill="#d670d6">8443</tspan> }</text>
<text x="8" y="75" xml:space="preserve">      <tspan fill="#e5e510">~</tspan> <tspan fill="#e5e510">env[&quot;DB_PASSWORD&quot;]</tspan> = (sensitive value)</text>
<text x="8" y="89" xml:space="preserve">    }</text>
<text x="8" y="103" xml:space="preserve"></text>
<text x="8" y="117" xml:space="preserve">  <tspan fill="#666666" font-style="italic"># resource.container.cache changed outside xcl and will be updated</tspan></text>
<text x="8" y="131" xml:space="preserve">  <tspan fill="#e5e510">~</tspan> <tspan fill="#bc3fbc" font-weight="bold">resource</tspan> <tspan fill="#11a8cd">&quot;container&quot;</tspan> <tspan fill="#0dbc79">&quot;cache&quot;</tspan> {}</text>
<text x="8" y="145" xml:space="preserve"></text>
