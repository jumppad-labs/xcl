<text x="8" y="173" xml:space="preserve">  <tspan fill="#0dbc79">+</tspan> <tspan fill="#bc3fbc" font-weight="bold">resource</tspan> <tspan fill="#11a8cd">&quot;container&quot;</tspan> <tspan fill="#0dbc79">&quot;web&quot;</tspan> {</text>
<text x="8" y="187" xml:space="preserve">      <tspan fill="#0dbc79">+</tspan> <tspan fill="#0dbc79">image</tspan>   = <tspan fill="#e5e510">&quot;nginx&quot;</tspan></text>
<text x="8" y="201" xml:space="preserve">      <tspan fill="#0dbc79">+</tspan> <tspan fill="#0dbc79">db_host</tspan> = (known after apply)</text>
<text x="8" y="215" xml:space="preserve">    }</text>
<text x="8" y="229" xml:space="preserve"></text>
<text x="8" y="243" xml:space="preserve">  <tspan fill="#666666" font-style="italic"># resource.network.app will be replaced, its last apply failed</tspan></text>
<text x="8" y="257" xml:space="preserve"><tspan fill="#e5e510">-/+</tspan> <tspan fill="#bc3fbc" font-weight="bold">resource</tspan> <tspan fill="#11a8cd">&quot;network&quot;</tspan> <tspan fill="#0dbc79">&quot;app&quot;</tspan> {}</text>
<text x="8" y="271" xml:space="preserve"></text>
