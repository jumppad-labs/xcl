<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 982 226" font-family="monospace" font-size="10">
<text x="8" y="19" xml:space="preserve"><tspan fill="#cd3131" font-weight="bold">Error</tspan><tspan font-weight="bold">: Unsupported block type</tspan></text>
<text x="8" y="33" xml:space="preserve"></text>
<text x="8" y="47" xml:space="preserve">  on main.xcl line 4, in variable.name, field timeout[0]:</text>
<text x="8" y="61" xml:space="preserve"><tspan opacity="0.5">     2 | </tspan>  <tspan fill="#2472c8">default</tspan> = <tspan fill="#e5e510">&quot;a&lt;b&quot;</tspan></text>
<text x="8" y="75" xml:space="preserve"><tspan opacity="0.5">     3 | </tspan></text>
<text x="8" y="89" xml:space="preserve"><tspan opacity="0.5">     4 | </tspan>  <tspan fill="#cd3131" font-weight="bold">timeout</tspan> <tspan fill="#0dbc79">&quot;http&quot;</tspan> {</text>
<text x="8" y="103" xml:space="preserve"><tspan opacity="0.5">     5 | </tspan>    <tspan fill="#2472c8">connect</tspan> = <tspan fill="#d670d6">30</tspan></text>
