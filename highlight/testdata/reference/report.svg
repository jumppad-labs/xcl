<text x="8" y="131" xml:space="preserve"></text>
<text x="8" y="145" xml:space="preserve">Blocks of type &quot;timeout&quot; are not expected here. A variable takes only default, description, type and sensitive, so move the timeout to the resource that uses it.</text>
<text x="8" y="159" xml:space="preserve"></text>
