syntax = "proto3";
package proto;
option go_package = "github.com/jumppad-labs/xcl/plugins/proto";

// Main plugin service (runs in plugin process)
service PluginService {
  rpc GetTypes(GetTypesRequest) returns (GetTypesResponse);
  rpc Validate(ValidateRequest) returns (ValidateResponse);
  rpc Create(CreateRequest) returns (CreateResponse);
  rpc Destroy(DestroyRequest) returns (DestroyResponse);
  rpc Read(ReadRequest) returns (ReadResponse);
  rpc Update(UpdateRequest) returns (UpdateResponse);
  rpc Changed(ChangedRequest) returns (ChangedResponse);
}

// Host callback service (run in host process) - consolidated logger and state
service HostCallbackService {
  // Logger methods
  rpc Info(LogRequest) returns (LogResponse);
  rpc Debug(LogRequest) returns (LogResponse);
  rpc Warn(LogRequest) returns (LogResponse);
  rpc Error(LogRequest) returns (LogResponse);
  
  // State methods
  rpc Get(StateGetRequest) returns (StateGetResponse);
  rpc Find(StateFindRequest) returns (StateFindResponse);
}

// Plugin service messages
message GetTypesRequest {}

message GetTypesResponse {
  repeated RegisteredType types = 1;
}

message RegisteredType {
  string type = 1;
  string sub_type = 2;
  bytes schema = 3;
}

message ValidateRequest {
  string entity_type = 1;
  string entity_sub_type = 2;
  bytes entity_data = 3;
}

message ValidateResponse {
  string error = 1;
}

message CreateRequest {
  string entity_type = 1;
  string entity_sub_type = 2;
  bytes entity_data = 3;
}

message CreateResponse {
  string error = 1;
  bytes mutated_entity_data = 2;
}

message DestroyRequest {
  string entity_type = 1;
  string entity_sub_type = 2;
  bytes entity_data = 3;
}

message DestroyResponse {
  string error = 1;
}

message ReadRequest {
  string entity_type = 1;
  string entity_sub_type = 2;
  bytes old_entity_data = 3;
  bytes new_entity_data = 4;
}

message ReadResponse {
  bytes entity_data = 1;
  string error = 2;
  // not_found is true when the provider reported that the real resource no
  // longer exists (plugins.ErrNotFound); error identity doesn't survive the wire
  bool not_found = 3;
}

message UpdateRequest {
  string entity_type = 1;
  string entity_sub_type = 2;
  bytes entity_data = 3;
  repeated PropertyChange changes = 4;
  repeated DependencyChange dependencies = 5;
}

message UpdateResponse {
  string error = 1;
  bytes updated_entity_data = 2;
}

// Change is what applying a new configuration needs for one entity, see
// entity.Change
enum Change {
  CHANGE_NO_CHANGE = 0;
  CHANGE_UPDATE = 1;
  CHANGE_REPLACE = 2;
}

// DependencyChange is a resource the entity depends on that the same apply
// will update or replace, see entity.DependencyChange
message DependencyChange {
  string address = 1;
  Change change = 2;
}

// StepKind is what one step of a path selects, see entity.StepKind
enum StepKind {
  STEP_KIND_ATTRIBUTE = 0;
  STEP_KIND_INDEX = 1;
  STEP_KIND_KEY = 2;
}

// PathStep is one step of the path to a setting, see entity.Step
message PathStep {
  StepKind kind = 1;
  string attribute = 2;
  int64 index = 3;
  string key = 4;
}

// PropertyChange is one setting that differs between the last apply and the
// new configuration, see entity.PropertyChange. before and after hold JSON
// values; empty means the value is absent.
message PropertyChange {
  repeated PathStep path = 1;
  bytes before = 2;
  bytes after = 3;
  bool unknown = 4;
  bool sensitive = 5;
}

message ChangedRequest {
  string entity_type = 1;
  string entity_sub_type = 2;
  bytes old_entity_data = 3;
  bytes new_entity_data = 4;
  repeated DependencyChange dependencies = 5;
  repeated PropertyChange changes = 6;
}

message ChangedResponse {
  // was: bool changed
  reserved 1;
  string error = 2;
  Change change = 3;
}

// Logger service messages
message LogRequest {
  string message = 1;
  repeated string args = 2;
  // call_id names the provider call the message was written during, the
  // host sent it as the xcl-call-id metadata of that call. It is empty for a
  // message written outside a provider call.
  string call_id = 3;
}

message LogResponse {}

// State service messages
message StateGetRequest {
  string key = 1;
}

message StateGetResponse {
  bytes resource_data = 1;
  string error = 2;
}

message StateFindRequest {
  string pattern = 1;
}

message StateFindResponse {
  repeated bytes resources_data = 1;
  string error = 2;
}