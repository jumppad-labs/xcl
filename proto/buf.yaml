# buf keeps the CoreService contract stable: buf lint keeps the names
# consistent and buf breaking refuses any change that renumbers or retypes a
# field, removes a method, or removes a field without reserving its number
# and name. This module is proto/; plugins/plugin.proto is
# generated by protoc through make protos and is not part of it.
version: v1
lint:
  use:
    - DEFAULT
  except:
    # the design shares one request or response between methods that take
    # or return the same thing, e.g. every Start* returns
    # StartOperationResponse and FindOne takes FindByTypeRequest
    - RPC_REQUEST_RESPONSE_UNIQUE
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
    # enum values are named as the design writes them
    - ENUM_VALUE_PREFIX
    - ENUM_ZERO_VALUE_SUFFIX
breaking:
  # a field may be removed only by reserving both its number and its name, so
  # neither is reused: FIELD_NO_DELETE refuses even a reserved removal, so
  # the two rules that allow exactly that take its place
  use:
    - FILE
    - FIELD_NO_DELETE_UNLESS_NUMBER_RESERVED
    - FIELD_NO_DELETE_UNLESS_NAME_RESERVED
  except:
    - FIELD_NO_DELETE
