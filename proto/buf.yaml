# buf keeps the CoreService contract stable: buf lint keeps the names
# consistent and buf breaking refuses any change that renumbers, retypes or
# removes a field or method. This module is proto/; plugins/plugin.proto is
# generated by protoc through make protos and is not part of it.
version: v1
lint:
  use:
    - DEFAULT
  except:
    # the design shares one request or response between methods that take
    # or return the same thing, e.g. every Start* returns
    # StartOperationResponse and FindOne takes FindByTypeRequest
    - RPC_REQUEST_RESPONSE_UNIQUE
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
    # enum values are named as the design writes them
    - ENUM_VALUE_PREFIX
    - ENUM_ZERO_VALUE_SUFFIX
breaking:
  use:
    - FILE
