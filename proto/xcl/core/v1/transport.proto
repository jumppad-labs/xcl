// The frames of the xcl-core transport: a host that runs the engine program,
// xcl-core --serve, rather than loading libxcl exchanges these messages with
// it over the program's standard input and output. Each frame on the pipe is
// a 4-byte big-endian length followed by one serialised message: Request
// frames from the host to the engine, Response frames from the engine to the
// host.
//
// The frames carry the same calls the C ABI carries, unchanged: handle,
// method, status and payload mean exactly what the arguments of xcl_call and
// xcl_release mean, and the payloads are the CoreService messages of
// core.proto. The ABI version GetVersion reports (abi_version, 1) covers the
// frames too: it changes only when a frame field or a status code changes.
//
// Field numbers are part of that contract: they are added and never renamed
// or reused.
syntax = "proto3";

package xcl.core.v1;

option go_package = "github.com/jumppad-labs/xcl/coreservice/proto;corepb";

// Request is one call from the host to the engine.
//
// id is chosen by the host and echoed back in the Response, so a host can
// have several calls in flight at once. handle, method and payload mean what
// the arguments of xcl_call mean: payload is the serialised CoreService
// request of the named method.
//
// The method name "Release" is reserved by the transport: it frees handle,
// as xcl_release does, takes an empty payload, and is answered with
// xcl_release's status and an empty payload. It is not a CoreService method.
message Request {
  uint64 id = 1;
  uint64 handle = 2;
  string method = 3;
  bytes payload = 4;
}

// Response answers the Request with the same id. Responses may arrive in any
// order: the engine runs each request on its own goroutine, so a Poll that
// waits does not hold up a Log or a Cancel sent while it waits.
//
// status is xcl_call's status, and payload the serialised CoreService
// response on success or the Error message otherwise. The negative statuses
// cross as their two's-complement value: the engine writes
// uint32(int32(status)), and a host reads a value of 2^31 or more as
// status - 2^32.
message Response {
  uint64 id = 1;
  uint32 status = 2;
  bytes payload = 3;
}
