# Tags each merge to main with the next version its pull request's release
# label asks for, using the shared auto-tag. The tag starts release.yml.
# Merges are tagged one at a time, so two never get the same version.

name: Tag

on:
  push:
    branches: [main]

concurrency:
  group: auto-tag
  cancel-in-progress: false

# the shared auto-tag reads the merged pull request's labels; a called
# workflow can only use the permissions its caller grants, and the
# repository's default token can read contents alone
permissions:
  contents: read
  pull-requests: read

jobs:
  tag:
    uses: ./.github/workflows/auto-tag.yml
    with:
      xcl-ref: ${{ github.sha }}
    secrets: inherit
