# Tags each merge to main with the next version its pull request's release
# label asks for, using the shared auto-tag. The tag starts release.yml.
# Merges are tagged one at a time, so two never get the same version.

name: Tag

on:
  push:
    branches: [main]

concurrency:
  group: auto-tag
  cancel-in-progress: false

jobs:
  tag:
    # a called workflow can not be given more than its caller has, and the
    # repository's default token reads contents only, while auto-tag also
    # reads the merged pull request's labels
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/auto-tag.yml
    with:
      xcl-ref: ${{ github.sha }}
    secrets: inherit
