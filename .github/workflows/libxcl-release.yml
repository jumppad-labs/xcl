# Builds the engine, libxcl, for eight platforms when a version tag is pushed,
# attaches the archives, a checksums file and its signature to the GitHub
# release, then dispatches the xcl-python release for the same tag.
#
# The archives follow the asset contract the GitHub plugin registry verifies
# (registry/github_assets.go): libxcl_<version>_<os>_<arch>.tar.gz (.zip on
# Windows), with _musl appended to the arch for the musl builds,
# libxcl_<version>_checksums.txt and libxcl_<version>_checksums.txt.sig, the
# version written without the leading v. The checksums are signed with the
# jumppad-labs release key, the key the registry trusts for plugins.
#
# Run by hand with publish left false, the workflow builds every target and
# keeps the assets as a workflow artifact, so the matrix can be checked
# before a real release.
#
# Secrets: XCL_RELEASE_GPG_KEY (armoured private key),
# XCL_RELEASE_GPG_PASSPHRASE, XCL_PYTHON_DISPATCH_TOKEN (a token with
# contents: read and actions: write on jumppad-labs/xcl-python).

name: libxcl release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: The tag to build, e.g. v0.4.0
        required: true
        type: string
      publish:
        description: Attach the assets to the release and dispatch xcl-python
        required: false
        type: boolean
        default: false

env:
  GO_VERSION: '1.27.0'
  ZIG_VERSION: '0.13.0'
  # llvm-mingw provides the Windows arm64 toolchain, which zig does not
  LLVM_MINGW_VERSION: '20240619'

jobs:
  # the tag being built, and whether the run publishes
  settings:
    name: Settings
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.settings.outputs.tag }}
      version: ${{ steps.settings.outputs.version }}
      publish: ${{ steps.settings.outputs.publish }}
    steps:
      - id: settings
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            tag="${{ github.ref_name }}"
            publish=true
          else
            tag="${{ inputs.tag }}"
            publish="${{ inputs.publish }}"
          fi
          case "$tag" in
            v*) ;;
            *) echo "the tag must start with v, got $tag"; exit 1 ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

  # Linux (glibc 2.28 and musl, x86-64 and arm64) and Windows x86-64 are
  # cross-compiled from one Linux runner with zig cc
  build-linux-windows:
    name: Build ${{ matrix.target.name }}
    needs: settings
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - { name: linux_amd64,      goos: linux,   goarch: amd64, cc: 'zig cc -target x86_64-linux-gnu.2.28',  glibc: '2.28' }
          - { name: linux_arm64,      goos: linux,   goarch: arm64, cc: 'zig cc -target aarch64-linux-gnu.2.28', glibc: '2.28' }
          - { name: linux_amd64_musl, goos: linux,   goarch: amd64, cc: 'zig cc -target x86_64-linux-musl' }
          - { name: linux_arm64_musl, goos: linux,   goarch: arm64, cc: 'zig cc -target aarch64-linux-musl' }
          - { name: windows_amd64,    goos: windows, goarch: amd64, cc: 'zig cc -target x86_64-windows-gnu' }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.settings.outputs.tag }}

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - uses: goto-bus-stop/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Build
        run: |
          make libxcl \
            LIBXCL_VERSION='${{ needs.settings.outputs.tag }}' \
            LIBXCL_OUT="$PWD/dist/${{ matrix.target.name }}/libxcl.$([ '${{ matrix.target.goos }}' = windows ] && echo dll || echo so)" \
            CC='${{ matrix.target.cc }}' \
            GOOS='${{ matrix.target.goos }}' \
            GOARCH='${{ matrix.target.goarch }}'
          cp bindings/libxcl/xcl.h "dist/${{ matrix.target.name }}/xcl.h"
          ls -la "dist/${{ matrix.target.name }}"

      # a glibc build must not need a newer glibc than the one it targets,
      # or the manylinux wheel built from it would fail on older systems
      - name: Check the glibc symbol versions
        if: matrix.target.glibc != ''
        run: |
          max=$(objdump -T "dist/${{ matrix.target.name }}/libxcl.so" | grep -o 'GLIBC_[0-9.]*' | sed 's/GLIBC_//' | sort -V | tail -1)
          echo "newest glibc symbol version: ${max:-none}"
          if [ -n "$max" ] && [ "$(printf '%s\n%s\n' "$max" '${{ matrix.target.glibc }}' | sort -V | tail -1)" != '${{ matrix.target.glibc }}' ]; then
            echo "the library needs glibc $max, newer than ${{ matrix.target.glibc }}"; exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: libxcl-${{ matrix.target.name }}
          path: dist/${{ matrix.target.name }}
          if-no-files-found: error

  build-windows-arm64:
    name: Build windows_arm64
    needs: settings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.settings.outputs.tag }}

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install llvm-mingw
        run: |
          curl -fsSL -o llvm-mingw.tar.xz \
            "https://github.com/mstorsjo/llvm-mingw/releases/download/${LLVM_MINGW_VERSION}/llvm-mingw-${LLVM_MINGW_VERSION}-ucrt-ubuntu-20.04-x86_64.tar.xz"
          mkdir -p "$HOME/llvm-mingw"
          tar -xJf llvm-mingw.tar.xz -C "$HOME/llvm-mingw" --strip-components=1
          echo "$HOME/llvm-mingw/bin" >> "$GITHUB_PATH"

      - name: Build
        run: |
          make libxcl \
            LIBXCL_VERSION='${{ needs.settings.outputs.tag }}' \
            LIBXCL_OUT="$PWD/dist/windows_arm64/libxcl.dll" \
            CC=aarch64-w64-mingw32-clang \
            GOOS=windows \
            GOARCH=arm64
          cp bindings/libxcl/xcl.h dist/windows_arm64/xcl.h

      - uses: actions/upload-artifact@v4
        with:
          name: libxcl-windows_arm64
          path: dist/windows_arm64
          if-no-files-found: error

  # macOS is built on GitHub's own runners with the Xcode toolchain
  build-macos:
    name: Build ${{ matrix.target.name }}
    needs: settings
    runs-on: ${{ matrix.target.runner }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - { name: darwin_amd64, runner: macos-13,     goarch: amd64 }
          - { name: darwin_arm64, runner: macos-latest, goarch: arm64 }
    env:
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.settings.outputs.tag }}

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build
        run: |
          make libxcl \
            LIBXCL_VERSION='${{ needs.settings.outputs.tag }}' \
            LIBXCL_OUT="$PWD/dist/${{ matrix.target.name }}/libxcl.dylib" \
            GOOS=darwin \
            GOARCH='${{ matrix.target.goarch }}'
          cp bindings/libxcl/xcl.h "dist/${{ matrix.target.name }}/xcl.h"

      - uses: actions/upload-artifact@v4
        with:
          name: libxcl-${{ matrix.target.name }}
          path: dist/${{ matrix.target.name }}
          if-no-files-found: error

  # package every build as a release asset, write and sign the checksums,
  # and attach them to the release when publishing
  package:
    name: Package and sign
    needs: [settings, build-linux-windows, build-windows-arm64, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.settings.outputs.version }}
      TAG: ${{ needs.settings.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.settings.outputs.tag }}

      - uses: actions/download-artifact@v4
        with:
          pattern: libxcl-*
          path: builds

      - name: Archive each build
        run: |
          mkdir -p assets
          for dir in builds/libxcl-*; do
            target="${dir#builds/libxcl-}"
            case "$target" in
              windows_*)
                (cd "$dir" && zip -q "../../assets/libxcl_${VERSION}_${target}.zip" libxcl.dll xcl.h) ;;
              *)
                lib=$(ls "$dir" | grep -E '^libxcl\.(so|dylib)$')
                tar -C "$dir" -czf "assets/libxcl_${VERSION}_${target}.tar.gz" "$lib" xcl.h ;;
            esac
          done
          ls -la assets
          [ "$(ls assets | wc -l)" -eq 8 ] || { echo "expected 8 archives"; exit 1; }

      - name: Write the checksums
        run: |
          cd assets
          sha256sum libxcl_*.tar.gz libxcl_*.zip > "libxcl_${VERSION}_checksums.txt"
          cat "libxcl_${VERSION}_checksums.txt"

      - name: Sign the checksums
        env:
          GPG_KEY: ${{ secrets.XCL_RELEASE_GPG_KEY }}
          GPG_PASSPHRASE: ${{ secrets.XCL_RELEASE_GPG_PASSPHRASE }}
        run: |
          if [ -z "$GPG_KEY" ]; then
            echo "XCL_RELEASE_GPG_KEY is not set; the checksums cannot be signed"; exit 1
          fi
          echo "$GPG_KEY" | gpg --batch --import
          cd assets
          gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" \
            --detach-sign --armor --output "libxcl_${VERSION}_checksums.txt.sig" "libxcl_${VERSION}_checksums.txt"
          gpg --verify "libxcl_${VERSION}_checksums.txt.sig" "libxcl_${VERSION}_checksums.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: assets
          if-no-files-found: error

      - name: Attach the assets to the release
        if: needs.settings.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "$TAG" --generate-notes
          fi
          gh release upload "$TAG" assets/* --clobber

  # tell xcl-python to build and publish the matching package
  dispatch:
    name: Dispatch the xcl-python release
    needs: [settings, package]
    if: needs.settings.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch
        env:
          GH_TOKEN: ${{ secrets.XCL_PYTHON_DISPATCH_TOKEN }}
          TAG: ${{ needs.settings.outputs.tag }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "XCL_PYTHON_DISPATCH_TOKEN is not set; xcl-python was not dispatched"; exit 1
          fi
          gh api "repos/jumppad-labs/xcl-python/dispatches" \
            --method POST \
            -f event_type=xcl-release \
            -F "client_payload[tag]=$TAG"
