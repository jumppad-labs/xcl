# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.27.0'

    - name: Build
      run: |
        CGO_ENABLED=0 GOOS=darwin go build -v ./...
        CGO_ENABLED=0 GOOS=linux go build -v ./...
        CGO_ENABLED=0 GOOS=windows go build -v ./...

    - name: Test
      run: go test -v ./... -race

    # The CoreService protocol in proto/ is part of the ABI contract of the
    # shared library: names are kept consistent by buf lint, and buf breaking
    # refuses any change that renumbers, retypes or removes a field or method.
    - name: Set up buf
      uses: bufbuild/buf-setup-action@v1.50.0
      with:
        version: 1.50.0
        github_token: ${{ secrets.GITHUB_TOKEN }}

    - name: Lint the protos
      run: buf lint

    # A pull request that introduces proto/ has nothing on main to break, and
    # buf refuses to compare against a module with no .proto files.
    - name: Check the protos for breaking changes
      if: github.event_name == 'pull_request'
      run: |
        git fetch --depth=1 origin main
        if [ -z "$(git ls-tree -r --name-only FETCH_HEAD -- proto | grep '\.proto$')" ]; then
          echo "main has no protos in proto/ yet; nothing to check for breaking changes"
          exit 0
        fi
        buf breaking --against 'https://github.com/${{ github.repository }}.git#branch=main,subdir=proto'

  # The minimum supported version is what the portable form of the lookup
  # surface exists for, and nothing else proves it: the newest toolchain
  # satisfies the go directive, so an ordinary build says nothing about the
  # floor and a break in it is silent until a consumer on an older Go reports
  # it. GOTOOLCHAIN pins the version rather than letting Go fetch a newer one.
  #
  # This job builds rather than tests, deliberately: plugins/example needs a
  # binary that a fresh checkout does not produce, so a suite run here would be
  # red for a reason unrelated to the toolchain and would teach contributors to
  # ignore the job.
  #
  # Each example is a Go module of its own, so the root build does not reach
  # it. The examples are built and vetted here as well: what a reader copies
  # out of an example has to compile on the minimum supported Go too.
  build-minimum-go:
    name: Build on minimum supported Go
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: go1.25.0
    steps:
    - uses: actions/checkout@v4

    - name: Set up minimum supported Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.25.0'

    - name: Confirm the toolchain really is the minimum
      run: |
        go version
        go version | grep -q 'go1\.25\.0' || { echo "expected go1.25.0"; exit 1; }

    - name: Build
      run: go build -v ./...

    - name: Vet
      run: go vet ./...

    - name: Build and vet the examples
      run: |
        for example in example/configonly example/plugin example/plugin/plugins/docker example/prettylog; do
          echo "== $example"
          (cd "$example" && go build -v ./... && go vet ./...) || exit 1
        done

    # The shared library is a module of its own, built with cgo, and must
    # compile on the minimum supported Go too
    - name: Build and vet libxcl
      run: cd bindings/libxcl && CGO_ENABLED=1 go build -v ./... && go vet ./...

  # libxcl is the engine built as a C shared library, from the nested module
  # bindings/libxcl, which is the only place cgo is used. The root module's
  # CGO_ENABLED=0 builds above are the guard that keeps it that way. This
  # job builds the library for the runner's platform and runs the smoke test
  # that calls through the four exported C functions.
  libxcl:
    name: Build and smoke-test libxcl
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.27.0'

    - name: Build the shared library
      run: make libxcl LIBXCL_VERSION=v0.0.0-ci

    - name: Check the exported symbols
      run: |
        nm -D --defined-only bindings/libxcl/build/libxcl.so | awk '$2 == "T" && $3 ~ /^xcl_/ {print $3}' | sort > exported.txt
        printf 'xcl_abi_version\nxcl_call\nxcl_free\nxcl_release\n' > expected.txt
        diff expected.txt exported.txt

    - name: Smoke-test through the C ABI
      run: make test-libxcl LIBXCL_VERSION=v0.0.0-ci

  # xcl-core, the engine program in cmd/xcl-core, must survive the console
  # control events a terminal sends its process group on Windows, which only
  # a Windows runner can show: its smoke tests start the program in a new
  # process group and send it Ctrl-Break, and drive it over pipes. The
  # Linux job above runs every test of the program, with POSIX signals and an
  # external plugin; the fixture plugin helpers build no .exe, so the plugin
  # test is not run here.
  xcl-core-windows:
    name: Test xcl-core on Windows
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.27.0'

    - name: Test
      env:
        CGO_ENABLED: '0'
      run: go test -count=1 -v -run 'TestVersionFlag|TestNoArguments|TestServe|TestClosingStdin|TestCtrlBreak' ./cmd/xcl-core/
